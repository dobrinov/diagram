<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagram</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="editor.css">
<style>
  /* the shell around the editor: schema's top bar (../schema/web/app.css) */
  :root { color-scheme: light dark;
    --bg: #ffffff; --line: #e1e4e8; --line-strong: #c9ced5; --fg: #1c2026; --muted: #5b636e; --bg-hover: #eef0f3;
    --mod: #935f00; --del: #c62a31;
    --font-ui: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #16191e; --line: #262b32; --line-strong: #3a414b; --fg: #e3e7ec; --muted: #9ba4af; --bg-hover: #1f232a; --mod: #e3ae4c; --del: #f07a7f; }
  }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.45 var(--font-ui); background: var(--bg); color: var(--fg); }
  .app-bar { height: 44px; display: flex; align-items: center; gap: 12px; padding: 0 12px; border-bottom: 1px solid var(--line); background: var(--bg); flex: none; }
  .app-bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14px; letter-spacing: -.01em; flex: none; }
  .app-bar .brand img { display: block; }
  .app-bar .vsep { width: 1px; height: 20px; background: var(--line); flex: none; }
  .app-bar .file { margin-left: auto; font: 600 12px var(--font-mono); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .app-bar .status { margin-left: -4px; color: var(--muted); font-size: 12px; white-space: nowrap; }
  #app-actions:empty, .app-bar .vsep:has(+ #app-actions:empty) { display: none; }
  .app-bar .file:not(:empty) + .status:not(:empty)::before { content: "· "; }
  .app-bar .status.dirty { color: var(--mod); }
  .app-bar .status.error { color: var(--del); }
  .app-bar select, .app-bar button, .app-bar label.btn { font: inherit; height: 28px; padding: 0 10px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--bg); color: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .app-bar button:hover, .app-bar label.btn:hover { background: var(--bg-hover); }
  #editor { flex: 1; min-height: 0; }
  @media (max-width: 640px) { .app-bar .file, .app-bar .status, .app-bar .vsep { display: none; } .app-bar { overflow-x: auto; } }
  #boot { margin: auto; color: var(--muted); }
</style>
</head>
<body>
<header class="app-bar">
  <div class="brand"><img src="favicon.svg" width="20" height="20" alt="">diagram</div>
  <div class="vsep"></div>
  <span id="app-actions" style="display:flex;gap:6px"></span>
  <span class="file" id="file"></span>
  <span class="status" id="status"></span>
</header>
<div id="editor"><p id="boot">Loading…</p></div>
<script src="pkg/diagram_wasm.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
