<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>diagram</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="stylesheet" href="editor.css">
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; background: #fff; color: #1f2328; }
  .app-bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-bottom: 1px solid #d0d7de; background: #f6f8fa; flex: none; }
  .app-bar .brand { display: flex; align-items: center; gap: 8px; font-weight: 700; color: inherit; text-decoration: none; }
  .app-bar .file { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: #656d76; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .app-bar .status { margin-left: auto; color: #656d76; font-size: 12px; white-space: nowrap; }
  .app-bar .status.dirty { color: #9a6700; }
  .app-bar .status.error { color: #cf222e; }
  .app-bar select, .app-bar button, .app-bar label.btn { font: inherit; min-height: 26px; padding: 0 8px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; color: inherit; cursor: pointer; display: inline-flex; align-items: center; }
  #editor { flex: 1; min-height: 0; }
  @media (max-width: 640px) { .app-bar .file, .app-bar .status { display: none; } .app-bar { overflow-x: auto; } }
  #boot { margin: auto; color: #656d76; }
  @media (prefers-color-scheme: dark) {
    body { background: #0d1117; color: #e6edf3; }
    .app-bar { background: #161b22; border-color: #30363d; }
    .app-bar .file, .app-bar .status { color: #8d96a0; }
    .app-bar select, .app-bar button, .app-bar label.btn { background: #0d1117; border-color: #30363d; }
  }
</style>
</head>
<body>
<header class="app-bar">
  <a class="brand" href="https://github.com/dobrinov/diagram" target="_blank" rel="noopener"><img src="favicon.svg" width="20" height="20" alt="">diagram</a>
  <span class="file" id="file"></span>
  <span id="app-actions" style="display:flex;gap:6px"></span>
  <span class="status" id="status"></span>
</header>
<div id="editor"><p id="boot">Loading…</p></div>
<script src="pkg/diagram_wasm.js"></script>
<script src="editor.js"></script>
<script src="app.js"></script>
</body>
</html>
