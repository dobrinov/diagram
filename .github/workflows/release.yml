name: Release

# A release is a version bump in Cargo.toml, a CHANGELOG.md entry, a commit
# and a tag vX.Y.Z; pushing the tag runs this workflow. It builds the binaries
# for every platform, publishes a GitHub Release with them (notes from
# CHANGELOG.md). The Homebrew formula in dobrinov/homebrew-tap follows on its
# own: a workflow there picks up the new release within the hour.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build again, e.g. v0.2.0"
        required: true

permissions:
  contents: write

# a new run for the same tag (re-run, re-tag) replaces the one in progress
concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: true

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  # The WASM bundle is the same on every platform: build it once, share it.
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm
      - name: Install wasm-pack
        run: curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh
      - name: Build the WASM bundle
        run: wasm-pack build crates/wasm --release --target no-modules --no-typescript --no-pack --out-dir ../../web/pkg
      - uses: actions/upload-artifact@v7
        with:
          name: web-pkg
          path: web/pkg
          if-no-files-found: error

  build:
    name: ${{ matrix.name }}
    needs: wasm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,         target: aarch64-apple-darwin,      name: macos-arm64 }
          # Intel macOS is cross-compiled on the Apple-silicon runner (the Intel runners are being retired)
          - { os: macos-14,         target: x86_64-apple-darwin,       name: macos-x86_64, cross: true }
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-arm64 }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - uses: actions/download-artifact@v8
        with:
          name: web-pkg
          path: web/pkg

      - name: Build the CLI
        shell: bash
        env:
          DIAGRAM_SKIP_WASM: "1"
          DIAGRAM_RELEASE_TAG: ${{ env.TAG }}
        run: cargo build --release --locked -p diagram --target ${{ matrix.target }}

      - name: Package
        id: pkg
        shell: bash
        run: |
          version="${TAG#v}"
          name="diagram-${version}-${{ matrix.name }}"
          mkdir -p dist
          if [[ "${{ matrix.os }}" == windows* ]]; then
            cp "target/${{ matrix.target }}/release/diagram.exe" dist/
            cp README.md LICENSE* dist/ 2>/dev/null || true
            (cd dist && 7z a -tzip "../${name}.zip" diagram.exe README.md LICENSE* >/dev/null)
            asset="${name}.zip"
          else
            cp "target/${{ matrix.target }}/release/diagram" dist/
            cp README.md LICENSE* dist/ 2>/dev/null || true
            tar -C dist -czf "${name}.tar.gz" diagram README.md $(cd dist && ls LICENSE* 2>/dev/null)
            asset="${name}.tar.gz"
          fi
          if command -v sha256sum >/dev/null; then sha256sum "$asset" > "$asset.sha256"; else shasum -a 256 "$asset" > "$asset.sha256"; fi
          cat "$asset.sha256"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/diagram"
          [[ "${{ matrix.os }}" == windows* ]] && bin="$bin.exe"
          "$bin" --version
          "$bin" check examples/example.diagram
          "$bin" svg examples/example.diagram --canvas metrics -o smoke.svg

      - uses: actions/upload-artifact@v7
        with:
          name: bin-${{ matrix.name }}
          path: |
            ${{ steps.pkg.outputs.asset }}
            ${{ steps.pkg.outputs.asset }}.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: bin-*
          path: assets
          merge-multiple: true
      - name: Checksums
        run: |
          cd assets
          cat *.sha256 > SHA256SUMS
          rm *.sha256
          ls -la
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
          path: src
          fetch-depth: 0
      # GitHub calls the release created last "latest": when two tags build
      # at once, that can be the older one. Only the highest version is.
      - name: Is this the newest version?
        id: newest
        run: |
          top=$(git -C src tag -l 'v*' --sort=-v:refname | head -1)
          echo "top tag: $top"
          echo "latest=$([ "$top" = "$TAG" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Release notes from CHANGELOG.md
        run: python3 src/scripts/changelog.py notes "$TAG" > notes.md || echo "No CHANGELOG.md entry for $TAG." > notes.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          name: diagram ${{ env.TAG }}
          body_path: notes.md
          generate_release_notes: true
          files: assets/*
          make_latest: ${{ steps.newest.outputs.latest }}
